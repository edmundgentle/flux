name: Flux
version: "1.0.8"
slug: flux
description: Local personal search, file management, and vision analysis server.
arch:
  - amd64
  - aarch64
startup: services
boot: auto
ports:
  8080/tcp: 8080
map:
  - config:rw
  - share:rw
  - media:rw
options:
  data_dir: /config/search_vision
  scan_dirs:
    - /share
    - /media
  instance_id: ""
  websocket_url: ""
  websocket_token: ""
  cloud_url: "https://flux-relay-fvnyy.ondigitalocean.app"
schema:
  data_dir: str
  scan_dirs:
    - str
  instance_id: str?
  websocket_url: str?
  websocket_token: password?
  cloud_url: str?
privileged:
  - SYS_ADMIN
devices:
  - /dev/fuse
