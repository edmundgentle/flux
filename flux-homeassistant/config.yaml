name: Flux
version: "1.0.12"
slug: flux
description: Local personal search, file management, and vision analysis server.
arch:
  - amd64
  - aarch64
startup: services
boot: auto
ingress: true
ingress_port: 8080
panel_icon: mdi:image-multiple-outline
ports:
  8080/tcp: 8080
map:
  - config:rw
  - share:rw
  - media:rw
options:
  data_dir: /config/search_vision
  scan_dirs:
    - /share
    - /media
schema:
  data_dir: str
  scan_dirs:
    - str
privileged:
  - SYS_ADMIN
devices:
  - /dev/fuse
