name: flux-relay
services:
  - name: web
    github:
      repo: edmundgentle/flux
      branch: main
      deploy_on_push: true
    source_dir: /flux-cloud
    build_command: rm -rf node_modules && npm install --include=dev --no-audit --no-fund && node -e "require('depd')" && npm run build
    run_command: npm start
    envs:
      - key: PORT
        value: "3000"
      - key: HOST
        value: "0.0.0.0"
      - key: DATABASE_URL
        value: "${db.DATABASE_URL}"
      - key: WS_PATH
        value: "/ws"
      - key: TRUST_PROXY
        value: "true"
      - key: CORS_ORIGINS
        value: "*"
    http_port: 3000
    health_check:
      http_path: /health
databases:
  - name: db
    cluster_name: flux-db
    engine: PG
    production: true
    version: "16"